name: Release

# Build installers and attach them to a GitHub Release when a version tag
# is pushed:  git tag v0.1.0 && git push origin v0.1.0
#
# Required repo secret: TAURI_SIGNING_PRIVATE_KEY (contents of the updater
# private key file — see INSTALL.md). No password is needed for the shipped key.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify updater endpoint is configured
        run: |
          if grep -q "YOUR-GITHUB-USERNAME" src-tauri/tauri.conf.json; then
            echo "::error::Set your GitHub username/org in src-tauri/tauri.conf.json (plugins.updater.endpoints) before tagging a release."
            exit 1
          fi

  build:
    needs: guard
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # Apple Silicon (M1+)
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest" # Intel Macs
            args: "--target x86_64-apple-darwin"
          - platform: "windows-latest"
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24 # npm 11 — avoids the npm 10.8.2 "Exit handler never called!" crash
          cache: "npm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ls react typescript vite # fail loudly if npm silently broke the install

      - name: Build and upload to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: v__VERSION__
          releaseName: "Pistachio Dictionary 开心果词典 v__VERSION__"
          releaseBody: "Download the installer for your OS below. See INSTALL.md in the repo for first-run notes (unsigned-build warnings)."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
