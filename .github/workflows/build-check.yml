name: Build check

# Fast feedback on every push: the frontend must typecheck/build and the
# Rust backend must compile (cargo check). Catches breakage long before a
# release tag is pushed.

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # Node 24 ships npm 11 — Node 20's npm 10.8.2 crashes on npm ci ("Exit handler never called!")
          cache: "npm"
      - run: npm ci --no-audit --no-fund
      - name: Verify install # npm has been known to fail with exit code 0 — make sure key packages actually landed
        run: npm ls react typescript vite
      - run: npm run build

  cargo-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
      - run: npm ci --no-audit --no-fund
      - name: Verify install
        run: npm ls react typescript vite
      - run: npm run build # tauri-build expects frontendDist to exist
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: cargo check
        working-directory: src-tauri
        run: cargo check
